<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: "Times New Roman", Times, serif;
      line-height: 1.2;
      color: #222;
      font-size: 12pt;
    }
    a { color: #0645ad; }
    hr { border: 0; border-top: 1px solid #999; margin: 24px 0; }
    .header { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .header img { width: 180px; border-radius: 4px; }
    .nav { margin: 0 0 16px; }
    .nav a { margin-right: 10px; }
    footer { margin-top: 48px; font-size: 0.85em; color: #777; }
    ul { list-style: none; padding-left: 1em; }
    li::before { content: " - "; }
    li { margin: 0; }
    p { margin: 0 0 2em; }
  </style>
</head>
<body>
  <p class="nav">
    [ <a href="/">Home</a>
    <a href="/projects/">Projects</a>
    <a href="/research/">Tutorials</a> ]
  </p>

  {{ content }}

  
</body>
</html>
